<div *ngIf="open" class="fixed inset-0 bg-black/50 flex items-center  justify-center z-50">
  <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg  w-96">
    <h2 *ngIf="title" class="text-xl font-bold mb-4 text-gray-700 dark:text-gray-200">{{ title }}</h2>
    <ng-content></ng-content>
    <div class="flex justify-end ">
      <app-button variant="secondary" (click)="close.emit()">Close</app-button>
    </div>
  </div>
</div>
