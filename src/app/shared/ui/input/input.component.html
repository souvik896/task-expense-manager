<div class="flex flex-col">
  <label *ngIf="label" class="text-sm font-medium text-gray-700 dark:text-gray-200">{{ label }}</label>
  <input
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    (input)="onInput($event)"
    class="mt-1 p-2 border rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
  />
</div>
